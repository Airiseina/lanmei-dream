services:
  # ── PostgreSQL（含 pgvector 扩展）──
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lanmei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanmei}
      POSTGRES_DB: ${POSTGRES_DB:-lanmei}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lanmei}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis（Conduit 状态存储）──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── 蓝妹 Bot ──
  lanmei:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LANMEI_DATABASE_URL: postgres://${POSTGRES_USER:-lanmei}:${POSTGRES_PASSWORD:-lanmei}@postgres:5432/${POSTGRES_DB:-lanmei}?sslmode=disable
      LANMEI_REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
